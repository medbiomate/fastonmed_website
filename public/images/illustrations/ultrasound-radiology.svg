<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%" fill="none">
  <!-- Subtle clean technical grid background -->
  <rect width="280" height="180" rx="12" fill="#f8fafc"/>
  <circle cx="140" cy="90" r="62" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="140" cy="90" r="42" fill="#e6f7f0" fill-opacity="0.45"/>

  <!-- ==================== ULTRASOUND & RADIOLOGY LINE ART ==================== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Mobile Trolley Base & 4 Casters -->
    <path d="M96 156 L184 156" stroke="#94a3b8" stroke-width="2.2"/>
    <ellipse cx="102" cy="162" rx="6" ry="4" stroke="#64748b" stroke-width="1.8"/>
    <ellipse cx="140" cy="162" rx="6" ry="4" stroke="#64748b" stroke-width="1.8"/>
    <ellipse cx="178" cy="162" rx="6" ry="4" stroke="#64748b" stroke-width="1.8"/>

    <!-- Central Body & Storage Column -->
    <rect x="122" y="98" width="36" height="58" rx="4" stroke="#475569" stroke-width="2" fill="#ffffff"/>
    <line x1="126" y1="116" x2="154" y2="116" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="126" y1="134" x2="154" y2="134" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Operator Console Keyboard Tray -->
    <path d="M102 98 L178 98 L172 82 L108 82 Z" stroke="#1e293b" stroke-width="2" fill="#ffffff"/>
    <!-- Central Trackball Outline -->
    <circle cx="140" cy="90" r="4.5" stroke="#00875a" stroke-width="1.8" fill="#e6f7f0"/>
    <!-- Console Control Knobs & Slider Bank -->
    <line x1="114" y1="88" x2="128" y2="88" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="114" y1="92" x2="128" y2="92" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="156" cy="87" r="2" stroke="#42b69c" stroke-width="1.2"/>
    <circle cx="164" cy="87" r="2" stroke="#42b69c" stroke-width="1.2"/>
    <circle cx="156" cy="93" r="2" stroke="#42b69c" stroke-width="1.2"/>
    <circle cx="164" cy="93" r="2" stroke="#42b69c" stroke-width="1.2"/>

    <!-- Probe Holster Cups on Console Side -->
    <rect x="96" y="84" width="8" height="14" rx="2" stroke="#334155" stroke-width="1.8" fill="#ffffff"/>
    <rect x="176" y="84" width="8" height="14" rx="2" stroke="#334155" stroke-width="1.8" fill="#ffffff"/>

    <!-- Articulated Monitor Support Arm -->
    <path d="M140 82 L140 68 L144 68" stroke="#334155" stroke-width="2.2"/>
    <circle cx="140" cy="74" r="2.5" fill="#00875a"/>

    <!-- High-Resolution Display Monitor -->
    <rect x="104" y="22" width="72" height="46" rx="5" stroke="#0f172a" stroke-width="2.2" fill="#ffffff"/>
    <rect x="109" y="27" width="62" height="36" rx="3" stroke="#e2e8f0" stroke-width="1.2" fill="#ffffff"/>

    <!-- Sector / Convex Ultrasound Beam Fan Lines (Brand Green #00875a) -->
    <path d="M140 31 L124 55 Q140 59 156 55 Z" stroke="#00875a" stroke-width="1.6" fill="#e6f7f0" fill-opacity="0.3"/>
    <path d="M140 31 L132 46 Q140 48 148 46 Z" stroke="#42b69c" stroke-width="1.2"/>
    <!-- Doppler Velocity Wave Graph below -->
    <path d="M114 60 L126 60 L130 57 L134 62 L138 58 L142 60 L166 60" stroke="#00875a" stroke-width="1.3"/>

    <!-- Flexible Transducer Cable & Convex Probe (Right Side) -->
    <path d="M180 94 Q204 102 198 124 T178 136 T194 144" stroke="#00875a" stroke-width="1.8"/>
    <!-- Convex Probe Body -->
    <g transform="translate(188, 138) rotate(-25)">
      <rect x="0" y="0" width="11" height="22" rx="3" stroke="#0f172a" stroke-width="1.8" fill="#ffffff"/>
      <path d="M0 20 Q5.5 24 11 20" stroke="#00875a" stroke-width="2" fill="#42b69c"/>
    </g>

    <!-- Transducer Probe in Left Holster -->
    <rect x="98" y="70" width="6" height="16" rx="2" stroke="#475569" stroke-width="1.5" fill="#ffffff"/>
    <path d="M100 86 Q86 96 90 114 T104 126" stroke="#42b69c" stroke-width="1.4" stroke-dasharray="3 2"/>

    <!-- Technical Ultrasound Wave Radiating Arcs (Top Right) -->
    <path d="M214 36 Q228 48 214 62" stroke="#42b69c" stroke-width="1.5" stroke-dasharray="3 2"/>
    <path d="M222 30 Q240 48 222 68" stroke="#00875a" stroke-width="1.5" stroke-dasharray="3 2"/>
    <circle cx="70" cy="46" r="2" fill="#00875a"/>
  </g>
</svg>
