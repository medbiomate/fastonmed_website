<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="radBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="radScreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>
    <filter id="radShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="220" rx="14" fill="url(#radBg)"/>

  <!-- Scanning Radiation / Doppler Sound Waves concentric arcs in background -->
  <g stroke="#c4b5fd" stroke-width="1.2" fill="none" opacity="0.45">
    <circle cx="210" cy="110" r="30" stroke-dasharray="4,4"/>
    <circle cx="210" cy="110" r="55" stroke-dasharray="5,5"/>
    <circle cx="210" cy="110" r="80" stroke-dasharray="6,6"/>
  </g>

  <!-- Ultrasound Console and Cart -->
  <g filter="url(#radShadow)">
    <!-- Wheeled Cart Base -->
    <ellipse cx="140" cy="190" rx="50" ry="10" fill="#cbd5e1"/>
    <rect x="95" y="190" width="12" height="15" rx="3" fill="#64748b"/>
    <rect x="175" y="190" width="12" height="15" rx="3" fill="#64748b"/>

    <!-- Central Body Cabinet -->
    <rect x="115" y="105" width="50" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <!-- Probe Holders -->
    <rect x="105" y="115" width="10" height="20" rx="3" fill="#e2e8f0"/>
    <rect x="165" y="115" width="10" height="20" rx="3" fill="#e2e8f0"/>

    <!-- Keyboard Control Console -->
    <polygon points="90,105 190,105 180,85 100,85" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Trackball & Controls -->
    <circle cx="140" cy="95" r="5" fill="#6366f1"/>
    <circle cx="120" cy="94" r="2" fill="#94a3b8"/>
    <circle cx="128" cy="94" r="2" fill="#94a3b8"/>
    <circle cx="152" cy="94" r="2" fill="#94a3b8"/>
    <circle cx="160" cy="94" r="2" fill="#94a3b8"/>

    <!-- Articulated Monitor Neck -->
    <rect x="135" y="68" width="10" height="18" rx="2" fill="#64748b"/>

    <!-- Ultrasound High-Resolution Display Screen -->
    <rect x="95" y="20" width="90" height="54" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <rect x="99" y="24" width="82" height="46" rx="4" fill="url(#radScreen)"/>

    <!-- Ultrasound Doppler Fan Scan on Screen -->
    <path d="M140,26 L110,64 A45,45 0 0,0 170,64 Z" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <!-- Doppler Color Blobs (Red & Blue Vascular Flow) -->
    <ellipse cx="142" cy="48" rx="8" ry="5" fill="#ef4444" opacity="0.8"/>
    <ellipse cx="136" cy="52" rx="7" ry="4" fill="#3b82f6" opacity="0.8"/>
    <!-- Scan Depth Scale lines on side of screen -->
    <line x1="174" y1="28" x2="178" y2="28" stroke="#a5b4fc" stroke-width="1"/>
    <line x1="174" y1="36" x2="178" y2="36" stroke="#a5b4fc" stroke-width="1"/>
    <line x1="174" y1="44" x2="178" y2="44" stroke="#a5b4fc" stroke-width="1"/>
    <line x1="174" y1="52" x2="178" y2="52" stroke="#a5b4fc" stroke-width="1"/>
    <line x1="174" y1="60" x2="178" y2="60" stroke="#a5b4fc" stroke-width="1"/>

    <!-- Transducer Ultrasound Probe held outward -->
    <!-- Probe Cable -->
    <path d="M110,125 C80,140 85,100 110,80 C130,65 190,65 210,95" fill="none" stroke="#6366f1" stroke-width="3"/>
    <!-- Probe Body -->
    <g transform="translate(205, 90) rotate(35)">
      <rect x="0" y="0" width="16" height="32" rx="4" fill="#ffffff" stroke="#4f46e5" stroke-width="1.5"/>
      <rect x="0" y="28" width="16" height="6" rx="2" fill="#4f46e5"/>
    </g>

    <!-- Radiating Ultrasound Doppler Scan Waves from Probe -->
    <path d="M228,118 Q250,130 260,155" fill="none" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M236,124 Q260,138 272,165" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round"/>
    <path d="M244,130 Q270,146 284,175" fill="none" stroke="#a5b4fc" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Top Right Floating Ultrasound Doppler Badge -->
  <g transform="translate(205, 20)" filter="url(#radShadow)">
    <rect width="96" height="24" rx="12" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="5" fill="#4f46e5"/>
    <text x="22" y="16" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#4338ca">Color Doppler</text>
  </g>
</svg>
