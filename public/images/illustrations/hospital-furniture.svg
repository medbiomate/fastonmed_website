<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="furnBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="mattressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00875a"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="bedShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="220" rx="14" fill="url(#furnBg)"/>

  <!-- Hospital Ward Line Accents in Background -->
  <g stroke="#cbd5e1" stroke-width="1" opacity="0.5">
    <line x1="20" y1="165" x2="300" y2="165"/>
    <line x1="20" y1="185" x2="300" y2="185"/>
  </g>

  <!-- Modern Electric ICU Bed Illustration -->
  <g filter="url(#bedShadow)">
    <!-- Lockable Medical Casters / Wheels -->
    <circle cx="95" cy="180" r="10" fill="#475569"/>
    <circle cx="95" cy="180" r="4" fill="#94a3b8"/>
    <circle cx="225" cy="180" r="10" fill="#475569"/>
    <circle cx="225" cy="180" r="4" fill="#94a3b8"/>

    <!-- Central Hydraulic Bed Base / Lifting Columns -->
    <rect x="110" y="150" width="100" height="15" rx="3" fill="#64748b"/>
    <polygon points="125,150 140,115 155,115 140,150" fill="#94a3b8"/>
    <polygon points="195,150 180,115 165,115 180,150" fill="#94a3b8"/>

    <!-- Articulated Medical Bed Frame -->
    <!-- Head section (Elevated at 35 degree angle) -->
    <g transform="translate(85, 110)">
      <rect x="0" y="0" width="55" height="14" rx="4" fill="url(#mattressGrad)" transform="rotate(-25)"/>
      <!-- Soft Ergonomic Pillow -->
      <ellipse cx="12" cy="-12" rx="12" ry="6" fill="#ffffff" transform="rotate(-25)"/>
    </g>

    <!-- Mid & Knee section -->
    <rect x="125" y="104" width="50" height="14" rx="3" fill="url(#mattressGrad)"/>

    <!-- Foot Section (Articulated slight angle) -->
    <g transform="translate(173, 104)">
      <rect x="0" y="0" width="62" height="14" rx="4" fill="url(#mattressGrad)" transform="rotate(8)"/>
    </g>

    <!-- Headboard & Footboard -->
    <rect x="70" y="70" width="10" height="50" rx="4" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="238" y="90" width="10" height="35" rx="4" fill="url(#metalGrad)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Fold-Down Safety Side Rails with Integrated Controls -->
    <rect x="100" y="80" width="45" height="20" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#00875a" stroke-width="1.5"/>
    <rect x="155" y="84" width="45" height="18" rx="4" fill="#ffffff" fill-opacity="0.9" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Digital Rail Control Panel Buttons -->
    <circle cx="112" cy="90" r="2.5" fill="#00875a"/>
    <circle cx="122" cy="90" r="2.5" fill="#38bdf8"/>
    <circle cx="132" cy="90" r="2.5" fill="#f59e0b"/>

    <!-- IV Infusion Drip Pole with Bag -->
    <line x1="65" y1="20" x2="65" y2="160" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <path d="M55,30 Q65,22 75,30" fill="none" stroke="#64748b" stroke-width="2"/>
    <!-- IV Saline Bag hanging -->
    <rect x="70" y="32" width="14" height="22" rx="3" fill="#ffffff" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
    <line x1="77" y1="54" x2="77" y2="85" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,2"/>
  </g>

  <!-- Top Right Certification Badge -->
  <g transform="translate(200, 20)" filter="url(#bedShadow)">
    <rect width="102" height="24" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="5" fill="#0f766e"/>
    <text x="22" y="16" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#0f766e">Medical Furniture</text>
  </g>
</svg>
