<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%" fill="none">
  <!-- Subtle clean technical grid background -->
  <rect width="280" height="180" rx="12" fill="#f8fafc"/>
  <circle cx="140" cy="90" r="62" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="140" cy="90" r="42" fill="#e6f7f0" fill-opacity="0.45"/>

  <!-- ==================== HOSPITAL BED & FURNITURE LINE ART ==================== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- IV Drip Stand Attached on Left -->
    <line x1="68" y1="28" x2="68" y2="152" stroke="#475569" stroke-width="2"/>
    <!-- IV Pole Double Rams-Horn Hooks -->
    <path d="M58 36 Q64 28 68 32 Q72 28 78 36" stroke="#00875a" stroke-width="2"/>
    <!-- IV Infusion Saline Bag -->
    <rect x="52" y="38" width="12" height="18" rx="3" stroke="#00875a" stroke-width="1.6" fill="#e6f7f0"/>
    <line x1="52" y1="46" x2="64" y2="46" stroke="#42b69c" stroke-width="1.2" stroke-dasharray="2 2"/>
    <!-- Infusion Tubing Line -->
    <path d="M58 56 Q58 72 76 86 T94 100" stroke="#00875a" stroke-width="1.4" stroke-dasharray="3 2"/>

    <!-- Bed Under-Frame Chassis -->
    <rect x="80" y="128" width="144" height="8" rx="2" stroke="#334155" stroke-width="2" fill="#ffffff"/>
    
    <!-- Central Actuator Lift Columns (X-Frame or Telescopic) -->
    <line x1="112" y1="128" x2="112" y2="108" stroke="#475569" stroke-width="2.5"/>
    <line x1="192" y1="128" x2="192" y2="108" stroke="#475569" stroke-width="2.5"/>
    <line x1="112" y1="128" x2="192" y2="108" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="192" y1="128" x2="112" y2="108" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Caster Wheels with Brakes -->
    <!-- Left Casters -->
    <ellipse cx="90" cy="148" rx="7" ry="7" stroke="#0f172a" stroke-width="2" fill="#ffffff"/>
    <circle cx="90" cy="148" r="2.5" fill="#475569"/>
    <line x1="90" y1="136" x2="90" y2="141" stroke="#334155" stroke-width="2.5"/>
    <rect x="84" y="142" width="5" height="4" rx="1" fill="#00875a"/> <!-- Brake Pedal -->

    <!-- Right Casters -->
    <ellipse cx="214" cy="148" rx="7" ry="7" stroke="#0f172a" stroke-width="2" fill="#ffffff"/>
    <circle cx="214" cy="148" r="2.5" fill="#475569"/>
    <line x1="214" y1="136" x2="214" y2="141" stroke="#334155" stroke-width="2.5"/>
    <rect x="208" y="142" width="5" height="4" rx="1" fill="#00875a"/>

    <!-- Articulated Bed Mattress Platform Frame -->
    <!-- Backrest section (Elevated ~35 deg) -->
    <path d="M80 72 L122 108" stroke="#0f172a" stroke-width="3"/>
    <!-- Center flat pelvic section -->
    <line x1="122" y1="108" x2="152" y2="108" stroke="#0f172a" stroke-width="3"/>
    <!-- Thigh section (Elevated ~20 deg) -->
    <path d="M152 108 L182 98" stroke="#0f172a" stroke-width="3"/>
    <!-- Calf/Foot section (Sloping to horizontal) -->
    <path d="M182 98 L224 108" stroke="#0f172a" stroke-width="3"/>

    <!-- Ergonomic Medical Mattress Layer (Brand Green Highlight #00875a) -->
    <path d="M82 66 L124 102 L152 102 L182 92 L224 102" stroke="#00875a" stroke-width="2.5"/>
    <path d="M82 66 Q88 60 94 66" stroke="#00875a" stroke-width="2" fill="#e6f7f0"/> <!-- Pillow -->

    <!-- Headboard (Left) -->
    <rect x="74" y="52" width="6" height="60" rx="3" stroke="#0f172a" stroke-width="2.2" fill="#ffffff"/>
    <line x1="74" y1="64" x2="80" y2="64" stroke="#00875a" stroke-width="2"/>

    <!-- Footboard (Right) -->
    <rect x="224" y="80" width="6" height="38" rx="3" stroke="#0f172a" stroke-width="2.2" fill="#ffffff"/>

    <!-- Split Tuck-Away Side Safety Rails (Line Art) -->
    <!-- Head-end Side Rail -->
    <rect x="94" y="66" width="34" height="16" rx="4" stroke="#00875a" stroke-width="1.8" fill="#ffffff"/>
    <line x1="104" y1="66" x2="104" y2="82" stroke="#42b69c" stroke-width="1.2"/>
    <line x1="114" y1="66" x2="114" y2="82" stroke="#42b69c" stroke-width="1.2"/>
    <line x1="124" y1="66" x2="124" y2="82" stroke="#42b69c" stroke-width="1.2"/>

    <!-- Foot-end Side Rail -->
    <rect x="156" y="82" width="36" height="16" rx="4" stroke="#334155" stroke-width="1.8" fill="#ffffff"/>
    <line x1="168" y1="82" x2="168" y2="98" stroke="#94a3b8" stroke-width="1.2"/>
    <line x1="180" y1="82" x2="180" y2="98" stroke="#94a3b8" stroke-width="1.2"/>

    <!-- Handheld Patient Control Pendant Cable -->
    <path d="M128 88 Q136 76 138 68" stroke="#475569" stroke-width="1.4"/>
    <rect x="134" y="56" width="8" height="12" rx="2" stroke="#0f172a" stroke-width="1.5" fill="#ffffff"/>
    <circle cx="138" cy="60" r="1" fill="#00875a"/>
    <circle cx="138" cy="64" r="1" fill="#00875a"/>

    <!-- Technical Marks -->
    <path d="M228 42 L236 42 M232 38 L232 46" stroke="#42b69c" stroke-width="1.5"/>
    <circle cx="218" cy="62" r="2" fill="#00875a"/>
  </g>
</svg>
