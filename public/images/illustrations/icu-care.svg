<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="icuBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00875a"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="220" rx="14" fill="url(#icuBg)"/>
  
  <!-- Subtle Medical Grid Background -->
  <g stroke="#bbf2dc" stroke-width="0.5" opacity="0.4">
    <line x1="20" y1="40" x2="300" y2="40"/>
    <line x1="20" y1="80" x2="300" y2="80"/>
    <line x1="20" y1="120" x2="300" y2="120"/>
    <line x1="20" y1="160" x2="300" y2="160"/>
    <line x1="60" y1="20" x2="60" y2="200"/>
    <line x1="120" y1="20" x2="120" y2="200"/>
    <line x1="180" y1="20" x2="180" y2="200"/>
    <line x1="240" y1="20" x2="240" y2="200"/>
  </g>

  <!-- Stylized Lungs Hologram in Background -->
  <g opacity="0.25" transform="translate(205, 45) scale(0.65)">
    <path d="M40,20 Q60,10 75,30 Q90,55 85,95 Q75,130 50,140 Q30,145 25,120 Q20,80 30,40 Z" fill="#00875a"/>
    <path d="M10,20 Q-10,10 -25,30 Q-40,55 -35,95 Q-25,130 0,140 Q20,145 25,120 Q30,80 20,40 Z" fill="#00875a"/>
    <line x1="25" y1="0" x2="25" y2="35" stroke="#00875a" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- ICU Trolley Base and Wheels -->
  <g filter="url(#dropShadow)">
    <!-- Base Plate -->
    <ellipse cx="140" cy="186" rx="55" ry="12" fill="#cbd5e1"/>
    <!-- Wheels -->
    <rect x="90" y="186" width="12" height="18" rx="4" fill="#64748b"/>
    <rect x="178" y="186" width="12" height="18" rx="4" fill="#64748b"/>
    <rect x="135" y="190" width="10" height="16" rx="3" fill="#475569"/>

    <!-- Central Telescopic Column -->
    <rect x="132" y="100" width="16" height="88" rx="3" fill="url(#bodyGrad)"/>
    <rect x="135" y="105" width="10" height="80" rx="2" fill="#94a3b8"/>
    
    <!-- Utility Shelf & Humidifier Chamber -->
    <rect x="110" y="130" width="60" height="8" rx="3" fill="#e2e8f0"/>
    <rect x="150" y="112" width="22" height="20" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1.5"/>
    <path d="M154,124 Q161,120 168,124" stroke="#0284c7" stroke-width="1.5" fill="none"/>

    <!-- Articulated Support Arm -->
    <path d="M108,80 L75,70 L65,100" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="75" cy="70" r="4" fill="#00875a"/>

    <!-- Breathing Tubing (Oxygen Blue & Expiratory White) -->
    <path d="M124,102 C105,120 75,125 65,102" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="4,2"/>
    <path d="M128,104 C112,126 82,130 68,106" fill="none" stroke="#ffffff" stroke-width="3"/>

    <!-- Main Ventilator Unit Head -->
    <rect x="102" y="32" width="76" height="70" rx="10" fill="url(#bodyGrad)" stroke="#cbd5e1" stroke-width="2"/>
    
    <!-- Medical Screen Bezel -->
    <rect x="108" y="38" width="64" height="48" rx="6" fill="url(#screenGrad)"/>
    
    <!-- Neon Pulmonary Waveforms on Screen -->
    <path d="M112,54 Q118,44 124,54 T136,54 T148,46 T158,54 T168,54" fill="none" stroke="#10b981" stroke-width="2" filter="url(#softGlow)"/>
    <path d="M112,68 Q120,60 128,68 T144,64 T160,68 T168,68" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    
    <!-- Digital Readings on Screen -->
    <text x="113" y="46" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#facc15">Ppeak 24</text>
    <text x="144" y="46" font-family="Arial, sans-serif" font-size="6" font-weight="bold" fill="#38bdf8">VTe 480</text>
    
    <!-- Rotary Encoder Knob & Status Light -->
    <circle cx="156" cy="93" r="5" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="112" y="91" width="18" height="4" rx="2" fill="#10b981"/>
    <circle cx="138" cy="93" r="2" fill="#38bdf8"/>
  </g>

  <!-- High-Tech Badge Floating in Top Right -->
  <g transform="translate(210, 24)" filter="url(#dropShadow)">
    <rect width="90" height="24" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="14" cy="12" r="5" fill="#00875a"/>
    <path d="M11,12 L13,14 L17,10" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <text x="24" y="16" font-family="Arial, sans-serif" font-size="9" font-weight="bold" fill="#00875a">ICU Care 24/7</text>
  </g>

  <!-- Decorative Medical Cross -->
  <g transform="translate(32, 28)" opacity="0.7">
    <rect x="8" y="0" width="6" height="22" rx="3" fill="#00875a"/>
    <rect x="0" y="8" width="22" height="6" rx="3" fill="#00875a"/>
  </g>
</svg>
