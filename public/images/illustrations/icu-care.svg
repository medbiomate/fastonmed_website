<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%" fill="none">
  <!-- Subtle clean technical grid background -->
  <rect width="280" height="180" rx="12" fill="#f8fafc"/>
  <circle cx="140" cy="90" r="62" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="140" cy="90" r="42" fill="#e6f7f0" fill-opacity="0.45"/>

  <!-- ==================== ICU VENTILATOR LINE ART ==================== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Stand Base & Casters -->
    <path d="M96 156 L184 156" stroke="#94a3b8" stroke-width="2.2"/>
    <ellipse cx="102" cy="162" rx="6" ry="4" stroke="#64748b" stroke-width="1.8"/>
    <ellipse cx="140" cy="162" rx="6" ry="4" stroke="#64748b" stroke-width="1.8"/>
    <ellipse cx="178" cy="162" rx="6" ry="4" stroke="#64748b" stroke-width="1.8"/>

    <!-- Central Stand Column -->
    <line x1="136" y1="96" x2="136" y2="156" stroke="#475569" stroke-width="2"/>
    <line x1="144" y1="96" x2="144" y2="156" stroke="#475569" stroke-width="2"/>
    <line x1="133" y1="126" x2="147" y2="126" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Humidifier Chamber on Pole -->
    <rect x="146" y="112" width="22" height="24" rx="4" stroke="#00875a" stroke-width="1.8" fill="#ffffff"/>
    <line x1="146" y1="124" x2="168" y2="124" stroke="#42b69c" stroke-width="1.2" stroke-dasharray="2 2"/>
    <path d="M157 112 L157 106 Q157 102 152 102 L144 102" stroke="#00875a" stroke-width="1.5"/>

    <!-- Ventilator Main Body Box -->
    <rect x="104" y="66" width="72" height="32" rx="5" stroke="#1e293b" stroke-width="2.2" fill="#ffffff"/>
    <!-- Vents / Grille -->
    <line x1="112" y1="88" x2="132" y2="88" stroke="#cbd5e1" stroke-width="1.5"/>
    <line x1="112" y1="92" x2="132" y2="92" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="162" cy="88" r="3" stroke="#00875a" stroke-width="1.5" fill="#e6f7f0"/>

    <!-- Articulated Display Screen Mount -->
    <path d="M136 66 L136 52 L128 52" stroke="#475569" stroke-width="2"/>
    
    <!-- Touchscreen Display Monitor -->
    <rect x="94" y="24" width="74" height="46" rx="5" stroke="#0f172a" stroke-width="2.2" fill="#ffffff"/>
    <rect x="99" y="29" width="64" height="36" rx="3" stroke="#e2e8f0" stroke-width="1.2" fill="#ffffff"/>
    
    <!-- Respiratory Waveform Lines (Emerald Green) -->
    <path d="M103 47 L114 47 L118 36 L123 54 L127 44 L131 47 L142 47 L146 36 L151 54 L155 44 L160 47" stroke="#00875a" stroke-width="1.8"/>
    <!-- Pressure Bar & Parameters -->
    <line x1="103" y1="34" x2="128" y2="34" stroke="#42b69c" stroke-width="1.8"/>
    <line x1="103" y1="59" x2="120" y2="59" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="154" cy="34" r="2.5" fill="#00875a"/>

    <!-- Support Arm & Breathing Circuit Tubing (Line Art) -->
    <path d="M104 74 L84 64 L74 82 L78 108" stroke="#00875a" stroke-width="1.8" stroke-dasharray="4 2"/>
    <path d="M108 80 L88 72 L80 90 L84 114" stroke="#42b69c" stroke-width="1.5"/>
    <!-- Y-Piece Connector -->
    <ellipse cx="81" cy="116" rx="4" ry="5" stroke="#1e293b" stroke-width="1.8" fill="#ffffff"/>
    <path d="M81 121 L81 132" stroke="#1e293b" stroke-width="2"/>

    <!-- Technical Measure Marks -->
    <path d="M196 42 L204 42 M200 38 L200 46" stroke="#42b69c" stroke-width="1.5"/>
    <circle cx="214" cy="74" r="2" fill="#00875a"/>
    <circle cx="70" cy="46" r="1.5" fill="#94a3b8"/>
  </g>
</svg>
