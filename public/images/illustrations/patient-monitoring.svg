<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%" fill="none">
  <!-- Subtle clean technical grid background -->
  <rect width="280" height="180" rx="12" fill="#f8fafc"/>
  <circle cx="140" cy="90" r="62" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="140" cy="90" r="42" fill="#e6f7f0" fill-opacity="0.45"/>

  <!-- ==================== PATIENT MONITOR LINE ART ==================== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Stand Base & Wheels -->
    <path d="M96 156 L184 156" stroke="#94a3b8" stroke-width="2.2"/>
    <ellipse cx="102" cy="162" rx="6" ry="4" stroke="#64748b" stroke-width="1.8"/>
    <ellipse cx="140" cy="162" rx="6" ry="4" stroke="#64748b" stroke-width="1.8"/>
    <ellipse cx="178" cy="162" rx="6" ry="4" stroke="#64748b" stroke-width="1.8"/>

    <!-- Vertical Stand Column with Cable Basket Outline -->
    <line x1="137" y1="104" x2="137" y2="156" stroke="#475569" stroke-width="2"/>
    <line x1="143" y1="104" x2="143" y2="156" stroke="#475569" stroke-width="2"/>
    
    <!-- Wire Cable Basket Outline -->
    <path d="M124 122 L156 122 L152 140 L128 140 Z" stroke="#94a3b8" stroke-width="1.5" fill="#ffffff"/>
    <line x1="134" y1="122" x2="134" y2="140" stroke="#cbd5e1" stroke-width="1.2"/>
    <line x1="146" y1="122" x2="146" y2="140" stroke="#cbd5e1" stroke-width="1.2"/>

    <!-- Swivel Mount Bracket -->
    <path d="M140 104 L140 92 M130 92 L150 92" stroke="#334155" stroke-width="2.2"/>

    <!-- Monitor Outer Casing -->
    <rect x="88" y="28" width="104" height="66" rx="7" stroke="#0f172a" stroke-width="2.2" fill="#ffffff"/>
    <!-- Top Integrated Carry Handle -->
    <path d="M122 28 L122 22 Q122 18 126 18 L154 18 Q158 18 158 22 L158 28" stroke="#334155" stroke-width="2"/>
    
    <!-- Inner Screen Bezel -->
    <rect x="94" y="34" width="92" height="54" rx="4" stroke="#e2e8f0" stroke-width="1.2" fill="#ffffff"/>

    <!-- ECG Rhythm Waveform Trace (Brand Green #00875a) -->
    <path d="M98 48 L114 48 L117 43 L120 56 L124 38 L127 52 L130 48 L142 48 L145 43 L148 56 L152 38 L155 52 L158 48 L170 48" stroke="#00875a" stroke-width="1.9"/>
    
    <!-- SpO2 Pleth Waveform Trace (Teal #42b69c) -->
    <path d="M98 64 Q105 57 111 64 T124 64 T137 64 T150 64 T163 64 L170 64" stroke="#42b69c" stroke-width="1.6"/>
    
    <!-- Respiratory Waveform / Bar -->
    <path d="M98 76 L112 76 Q118 72 124 76 T136 76 L154 76" stroke="#0ea5e9" stroke-width="1.4"/>

    <!-- Digital Parameter Numerics (Right side indicators) -->
    <text x="173" y="47" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#00875a">75</text>
    <text x="173" y="63" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#42b69c">99</text>
    <text x="169" y="78" font-family="Arial, sans-serif" font-size="7" font-weight="bold" fill="#64748b">120/80</text>

    <!-- Side Connection Ports & Patient Cable -->
    <circle cx="88" cy="50" r="2.5" stroke="#00875a" stroke-width="1.5" fill="#ffffff"/>
    <circle cx="88" cy="62" r="2.5" stroke="#42b69c" stroke-width="1.5" fill="#ffffff"/>
    <circle cx="88" cy="74" r="2.5" stroke="#64748b" stroke-width="1.5" fill="#ffffff"/>

    <!-- Patient Lead Wire Loop Outline -->
    <path d="M85 50 Q66 60 70 82 T62 108" stroke="#00875a" stroke-width="1.6" stroke-dasharray="3 2"/>
    <path d="M85 62 Q72 74 76 96 T70 120" stroke="#42b69c" stroke-width="1.4"/>
    <!-- Sensor Clip -->
    <rect x="58" y="108" width="10" height="7" rx="2" stroke="#0f172a" stroke-width="1.5" fill="#ffffff"/>

    <!-- Subtle Technical Crosshairs -->
    <path d="M214 36 L222 36 M218 32 L218 40" stroke="#00875a" stroke-width="1.5"/>
    <circle cx="218" cy="66" r="2" fill="#42b69c"/>
    <circle cx="68" cy="38" r="1.5" fill="#94a3b8"/>
  </g>
</svg>
