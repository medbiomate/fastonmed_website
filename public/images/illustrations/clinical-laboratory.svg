<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%" fill="none">
  <!-- Subtle clean technical grid background -->
  <rect width="280" height="180" rx="12" fill="#f8fafc"/>
  <circle cx="140" cy="90" r="62" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="140" cy="90" r="42" fill="#e6f7f0" fill-opacity="0.45"/>

  <!-- ==================== CLINICAL LABORATORY MICROSCOPE LINE ART ==================== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Microscope Heavy Horseshoe Base -->
    <path d="M104 158 L176 158 Q182 158 182 152 L178 144 L102 144 L98 152 Q98 158 104 158 Z" stroke="#0f172a" stroke-width="2.2" fill="#ffffff"/>
    
    <!-- Lower Built-in Light Illuminator & Condenser -->
    <ellipse cx="140" cy="144" rx="10" ry="4" stroke="#475569" stroke-width="1.8" fill="#ffffff"/>
    <path d="M134 144 L134 134 L146 134 L146 144" stroke="#475569" stroke-width="1.8"/>
    <!-- Condenser Lens / Light Beam -->
    <polygon points="135,134 145,134 148,118 132,118" stroke="#42b69c" stroke-width="1.2" fill="#e6f7f0" fill-opacity="0.5"/>

    <!-- Specimen Stage Platform -->
    <rect x="110" y="112" width="60" height="6" rx="2" stroke="#1e293b" stroke-width="2.2" fill="#ffffff"/>
    <!-- Specimen Glass Slide on Stage -->
    <rect x="124" y="108" width="32" height="4" rx="1" stroke="#00875a" stroke-width="1.5" fill="#e6f7f0"/>
    <circle cx="140" cy="110" r="2.5" fill="#00875a"/>

    <!-- Curved Robust Microscope Arm Frame -->
    <path d="M168 144 L168 114 Q168 76 148 64 L140 64" stroke="#0f172a" stroke-width="2.5"/>
    
    <!-- Coarse & Fine Focus Adjustment Knobs -->
    <circle cx="168" cy="118" r="8" stroke="#334155" stroke-width="2" fill="#ffffff"/>
    <circle cx="168" cy="118" r="4.5" stroke="#00875a" stroke-width="1.8" fill="#e6f7f0"/>

    <!-- Revolving Objective Nosepiece (Turret) -->
    <ellipse cx="140" cy="80" rx="14" ry="6" stroke="#1e293b" stroke-width="2" fill="#ffffff"/>
    
    <!-- 3 Objective Lenses -->
    <!-- Center Active Objective Lens pointing to Slide -->
    <rect x="137" y="86" width="6" height="18" rx="2" stroke="#00875a" stroke-width="1.9" fill="#ffffff"/>
    <line x1="137" y1="100" x2="143" y2="100" stroke="#00875a" stroke-width="2"/>
    <!-- Left Objective Lens -->
    <g transform="translate(126, 84) rotate(22)">
      <rect x="0" y="0" width="5" height="14" rx="1.5" stroke="#475569" stroke-width="1.5" fill="#ffffff"/>
    </g>
    <!-- Right Objective Lens -->
    <g transform="translate(149, 84) rotate(-22)">
      <rect x="0" y="0" width="5" height="14" rx="1.5" stroke="#475569" stroke-width="1.5" fill="#ffffff"/>
    </g>

    <!-- Optical Head & Body Tube -->
    <rect x="130" y="52" width="20" height="28" rx="3" stroke="#1e293b" stroke-width="2" fill="#ffffff"/>

    <!-- Binocular Eyepiece Tubes (Angled 30 deg) -->
    <!-- Left Eyepiece -->
    <path d="M134 52 L124 28" stroke="#334155" stroke-width="2.5"/>
    <rect x="120" y="22" width="9" height="7" rx="2" stroke="#0f172a" stroke-width="1.8" fill="#ffffff"/>
    <!-- Right Eyepiece -->
    <path d="M144 52 L154 28" stroke="#334155" stroke-width="2.5"/>
    <rect x="149" y="22" width="9" height="7" rx="2" stroke="#0f172a" stroke-width="1.8" fill="#ffffff"/>

    <!-- Scientific Test Tube Rack Line Art on Left -->
    <g transform="translate(68, 98)">
      <rect x="0" y="32" width="34" height="22" rx="3" stroke="#94a3b8" stroke-width="1.5" fill="#ffffff"/>
      <!-- Test Tubes -->
      <rect x="6" y="8" width="5" height="34" rx="2.5" stroke="#00875a" stroke-width="1.5" fill="#e6f7f0"/>
      <line x1="6" y1="24" x2="11" y2="24" stroke="#00875a" stroke-width="1.5"/>
      <rect x="14" y="14" width="5" height="28" rx="2.5" stroke="#42b69c" stroke-width="1.5" fill="#e6f7f0"/>
      <line x1="14" y1="28" x2="19" y2="28" stroke="#42b69c" stroke-width="1.5"/>
      <rect x="22" y="4" width="5" height="38" rx="2.5" stroke="#0ea5e9" stroke-width="1.5" fill="#ffffff"/>
    </g>

    <!-- DNA Double Helix Line Art on Right -->
    <g transform="translate(204, 52)" stroke="#42b69c" stroke-width="1.5">
      <path d="M4 0 Q18 20 4 40 T4 80" stroke-dasharray="2 2"/>
      <path d="M18 0 Q4 20 18 40 T18 80" stroke-dasharray="2 2"/>
      <line x1="7" y1="12" x2="15" y2="12" stroke="#00875a" stroke-width="1.6"/>
      <line x1="5" y1="26" x2="17" y2="26" stroke="#00875a" stroke-width="1.6"/>
      <line x1="7" y1="40" x2="15" y2="40" stroke="#00875a" stroke-width="1.6"/>
      <line x1="6" y1="54" x2="16" y2="54" stroke="#00875a" stroke-width="1.6"/>
      <line x1="7" y1="68" x2="15" y2="68" stroke="#00875a" stroke-width="1.6"/>
    </g>

    <!-- Technical Crosshairs -->
    <circle cx="218" cy="36" r="2" fill="#00875a"/>
  </g>
</svg>
