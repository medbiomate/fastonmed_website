<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <linearGradient id="labBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="scopeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="labShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="320" height="220" rx="14" fill="url(#labBg)"/>

  <!-- Molecular DNA Double Helix Motif in Background -->
  <g opacity="0.3" stroke="#00875a" stroke-width="1.8" fill="none">
    <path d="M220,20 Q240,40 220,60 T220,100 T220,140 T220,180"/>
    <path d="M240,20 Q220,40 240,60 T240,100 T240,140 T240,180"/>
    <line x1="220" y1="40" x2="240" y2="40"/>
    <line x1="220" y1="80" x2="240" y2="80"/>
    <line x1="220" y1="120" x2="240" y2="120"/>
    <line x1="220" y1="160" x2="240" y2="160"/>
  </g>

  <!-- Diagnostic Microscope Illustration -->
  <g filter="url(#labShadow)">
    <!-- Heavy Solid Base -->
    <path d="M90,195 L180,195 L175,180 L95,180 Z" fill="#475569"/>
    <rect x="95" y="193" width="80" height="4" rx="2" fill="#334155"/>

    <!-- Curved Microscope Arm / Stand -->
    <path d="M165,180 C175,130 170,80 140,65 L125,65 L125,80 C145,95 150,135 145,180 Z" 
          fill="url(#scopeGrad)" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Coarse / Fine Adjustment Dials -->
    <circle cx="160" cy="155" r="9" fill="#64748b"/>
    <circle cx="160" cy="155" r="5" fill="#94a3b8"/>

    <!-- Specimen Mechanical Stage Platform -->
    <rect x="90" y="125" width="60" height="8" rx="2" fill="#334155"/>
    <!-- Glass Slide with Specimen -->
    <rect x="105" y="122" width="28" height="3" fill="#38bdf8" opacity="0.8"/>
    <circle cx="119" cy="123.5" r="2" fill="#ef4444"/>

    <!-- Substage Condenser & Light Source Illuminator -->
    <path d="M110,150 L128,150 L124,178 L114,178 Z" fill="#94a3b8"/>
    <!-- Light Beam shining up through slide -->
    <polygon points="114,150 124,150 121,125 117,125" fill="#fef08a" opacity="0.7"/>

    <!-- Revolving Objective Nosepiece -->
    <circle cx="119" cy="98" r="10" fill="#64748b"/>
    <!-- 3 Objective Lenses -->
    <rect x="116" y="98" width="6" height="18" rx="1.5" fill="#00875a"/>
    <rect x="110" y="95" width="5" height="15" rx="1" fill="#eab308" transform="rotate(-25, 110, 95)"/>
    <rect x="124" y="95" width="5" height="16" rx="1" fill="#3b82f6" transform="rotate(25, 124, 95)"/>

    <!-- Eyepiece Tube & Binocular Head -->
    <rect x="112" y="48" width="14" height="24" rx="3" fill="#cbd5e1"/>
    <!-- Angled Eyepieces -->
    <path d="M114,50 L95,28 L103,22 L119,45" fill="url(#scopeGrad)" stroke="#94a3b8" stroke-width="1"/>
    <path d="M124,50 L140,28 L148,22 L129,45" fill="url(#scopeGrad)" stroke="#94a3b8" stroke-width="1"/>
    <!-- Rubber Eye Cups -->
    <ellipse cx="99" cy="25" rx="5" ry="3" fill="#334155"/>
    <ellipse cx="144" cy="25" rx="5" ry="3" fill="#334155"/>
  </g>

  <!-- Test Tube Rack on the Left -->
  <g transform="translate(42, 130)" filter="url(#labShadow)">
    <rect x="0" y="35" width="46" height="25" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Test Tube 1 (Green Solution) -->
    <rect x="8" y="5" width="8" height="38" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="9" y="20" width="6" height="21" rx="3" fill="#10b981"/>
    <!-- Test Tube 2 (Blue Solution) -->
    <rect x="20" y="0" width="8" height="43" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="21" y="16" width="6" height="25" rx="3" fill="#0284c7"/>
    <!-- Test Tube 3 (Amber Solution) -->
    <rect x="31" y="8" width="8" height="35" rx="4" fill="#ffffff" stroke="#94a3b8"/>
    <rect x="32" y="24" width="6" height="17" rx="3" fill="#f59e0b"/>
  </g>

  <!-- Top Right Diagnostic Lab Badge -->
  <g transform="translate(205, 20)" filter="url(#labShadow)">
    <rect width="98" height="24" rx="12" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="5" fill="#00875a"/>
    <text x="22" y="16" font-family="Arial, sans-serif" font-size="8.5" font-weight="bold" fill="#00875a">Clinical Lab</text>
  </g>
</svg>
