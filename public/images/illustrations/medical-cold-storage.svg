<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 180" width="100%" height="100%" fill="none">
  <!-- Subtle clean technical grid background -->
  <rect width="280" height="180" rx="12" fill="#f8fafc"/>
  <circle cx="140" cy="90" r="62" stroke="#e2e8f0" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="140" cy="90" r="42" fill="#e6f7f0" fill-opacity="0.45"/>

  <!-- ==================== MEDICAL REFRIGERATOR LINE ART ==================== -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Refrigerator Main Outer Casing -->
    <rect x="100" y="20" width="80" height="136" rx="6" stroke="#0f172a" stroke-width="2.2" fill="#ffffff"/>

    <!-- Bottom Leveling Feet & Casters -->
    <rect x="108" y="156" width="12" height="6" rx="2" stroke="#475569" stroke-width="1.8" fill="#cbd5e1"/>
    <rect x="160" y="156" width="12" height="6" rx="2" stroke="#475569" stroke-width="1.8" fill="#cbd5e1"/>

    <!-- Top Digital Control Panel Header -->
    <rect x="106" y="26" width="68" height="18" rx="3" stroke="#1e293b" stroke-width="1.8" fill="#f8fafc"/>
    <!-- Digital Temperature Readout (+3.8°C in Brand Green) -->
    <rect x="122" y="30" width="36" height="10" rx="2" stroke="#00875a" stroke-width="1.2" fill="#e6f7f0"/>
    <text x="126" y="38" font-family="monospace" font-size="8" font-weight="bold" fill="#00875a">+3.8°C</text>
    <!-- Indicator LEDs -->
    <circle cx="112" cy="35" r="1.8" fill="#00875a"/>
    <circle cx="117" cy="35" r="1.8" fill="#42b69c"/>
    <circle cx="165" cy="35" r="1.5" stroke="#94a3b8" stroke-width="1"/>

    <!-- Glass Door Frame -->
    <rect x="106" y="48" width="68" height="96" rx="4" stroke="#334155" stroke-width="2" fill="#ffffff"/>
    <rect x="110" y="52" width="60" height="88" rx="2" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Door Vertical Tubular Handle -->
    <line x1="164" y1="62" x2="164" y2="108" stroke="#00875a" stroke-width="2.5"/>
    <line x1="162" y1="62" x2="166" y2="62" stroke="#00875a" stroke-width="2"/>
    <line x1="162" y1="108" x2="166" y2="108" stroke="#00875a" stroke-width="2"/>

    <!-- Interior Storage Shelves (Wire Grid Lines) -->
    <!-- Shelf 1 with Vaccine Vials -->
    <line x1="112" y1="74" x2="160" y2="74" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="116" y="62" width="7" height="12" rx="1.5" stroke="#00875a" stroke-width="1.4" fill="#e6f7f0"/>
    <rect x="125" y="62" width="7" height="12" rx="1.5" stroke="#00875a" stroke-width="1.4" fill="#e6f7f0"/>
    <rect x="134" y="62" width="7" height="12" rx="1.5" stroke="#42b69c" stroke-width="1.4" fill="#e6f7f0"/>
    <rect x="143" y="62" width="7" height="12" rx="1.5" stroke="#42b69c" stroke-width="1.4" fill="#e6f7f0"/>

    <!-- Shelf 2 with Specimen Box Outline -->
    <line x1="112" y1="100" x2="160" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="116" y="86" width="30" height="14" rx="2" stroke="#334155" stroke-width="1.4" fill="#f8fafc"/>
    <line x1="116" y1="91" x2="146" y2="91" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="150" y="88" width="6" height="12" rx="1" stroke="#00875a" stroke-width="1.3"/>

    <!-- Shelf 3 with Ampoule Tray -->
    <line x1="112" y1="126" x2="160" y2="126" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="118" y="115" width="22" height="11" rx="2" stroke="#64748b" stroke-width="1.3"/>
    <line x1="124" y1="115" x2="124" y2="126" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="132" y1="115" x2="132" y2="126" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Glass Reflection Diagonal Lines -->
    <line x1="120" y1="56" x2="148" y2="84" stroke="#e2e8f0" stroke-width="1.2"/>
    <line x1="126" y1="56" x2="154" y2="84" stroke="#e2e8f0" stroke-width="1.2"/>

    <!-- Snowflake / Cold-Chain Symbol in Background -->
    <g transform="translate(68, 64) scale(0.65)" stroke="#42b69c" stroke-width="1.6">
      <line x1="20" y1="6" x2="20" y2="34"/>
      <line x1="6" y1="20" x2="34" y2="20"/>
      <line x1="10" y1="10" x2="30" y2="30"/>
      <line x1="10" y1="30" x2="30" y2="10"/>
      <path d="M18 10 L20 6 L22 10 M18 30 L20 34 L22 30 M10 18 L6 20 L10 22 M30 18 L34 20 L30 22"/>
    </g>

    <!-- Technical Marks -->
    <path d="M210 50 L218 50 M214 46 L214 54" stroke="#00875a" stroke-width="1.5"/>
    <circle cx="214" cy="78" r="2" fill="#42b69c"/>
  </g>
</svg>
